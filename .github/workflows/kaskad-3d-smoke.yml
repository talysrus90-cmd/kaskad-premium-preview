name: KASKAD 3D browser regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: kaskad-3d-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kaskad-http.log 2>&1 &
          sleep 2
      - name: Desktop / mobile 3D UI smoke
        run: node tests/v48-browser-check.mjs
      - name: Keep test screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaskad-v48-browser-screens
          path: test-results/
          if-no-files-found: ignore
